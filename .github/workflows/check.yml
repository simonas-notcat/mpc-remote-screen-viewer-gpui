name: Check
on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check-fixtures.py
      - run: python3 -m unittest discover -s tests -p 'test_manual_import.py'
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      # Compiles/tests the output backend and selection logic without opening hardware.
      - run: cargo test --locked --features audio-output
      - run: cargo clippy --locked --features audio-output --all-targets -- -D warnings

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Poppler/Tesseract are only for offline preparation tests, not device MCP.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: python3 -m unittest discover -s tests -p 'test_manual_import.py'
      - run: cargo test --locked --features mcp --all-targets
      - run: cargo clippy --locked --features mcp --all-targets -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo test --locked --no-default-features --all-targets
      - run: cargo check --locked --features mcp --all-targets
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo check --locked --features audio-output --all-targets

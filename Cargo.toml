[package]
name = "mpc-remote-screen-viewer-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust and GPUI desktop client for MPC remote screen viewing, control and device audio"
publish = false
default-run = "mpc-remote-screen-viewer-gpui"

[features]
default = []
desktop = ["dep:gpui", "dep:gpui-component", "dep:chrono", "audio-output"]
audio-output = ["dep:cpal"]
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio"]

[[bin]]
name = "mpc-remote-screen-viewer-gpui"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "mpc-mcp"
path = "src/bin/mpc-mcp.rs"
required-features = ["mcp"]

[dependencies]
base64 = "0.22"
rmcp = { version = "=3.10.0", optional = true, default-features = false, features = ["server", "macros", "transport-io"] }
schemars = { version = "1", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-std", "sync"] }
cpal = { version = "0.16", optional = true }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock"] }
gpui = { version = "=0.2.2", optional = true }
# This release uses Zed's GPUI 0.2.2, rather than a different GPUI fork.
gpui-component = { version = "=0.5.1", optional = true, default-features = false }
getrandom = { version = "0.4.3", features = ["std"] }
hmac = "0.12.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# GPUI 0.2.2's xattr 0.2 dependency still needs the Linux ENOATTR alias.
libc = "=0.2.183"
lz4_flex = "0.14.0"
pbkdf2 = "0.12.2"
rustfft = "6.4"
serde_json = "1"
sha2 = "0.10.9"
socket2 = "0.6.4"
thiserror = "2"
zeroize = "1.8"
zstd = { version = "0.14.4", default-features = false }

[profile.release]
lto = "thin"
strip = true
